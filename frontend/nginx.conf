server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # =====================================================
    # Node.js API API — preserve the /api/* prefix.
    # proxy_pass WITHOUT a trailing URI keeps the original
    # path, so /api/contacts -> backend:8000/api/contacts.
    # =====================================================
    # Bare /api (no trailing slash) has no backend route; redirect it
    # so it still lands on the API instead of the SPA fallback.
    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # Re-resolve the backend name via Docker's embedded DNS so a
        # recreated backend container (new IP) never causes stale-IP 502s.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://node-backend:8080;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # =====================================================
    # Vue SPA — must come after /api/ so API routes win.
    # try_files supports client-side routing on refresh
    # (/, /login, /register, /contacts, /profile, ...).
    # =====================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =====================================================
    # Static assets — served directly, never fall back to
    # index.html (avoids returning HTML for missing files).
    # =====================================================
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
