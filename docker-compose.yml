services:
  postgres-node:
    image: postgres:16-alpine
    container_name: phonebook-node-postgres
    environment:
      POSTGRES_DB: phonebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_node_data:/var/lib/postgresql/data
    restart: unless-stopped

  node-backend:
    build: ./backend-node
    container_name: phonebook-node-backend
    environment:
      PORT: 8080
      DB_HOST: postgres-node
      DB_PORT: 5432
      DB_NAME: phonebook
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-secret-key-in-production-please-use-a-long-random-value
      JWT_EXPIRATION_MINUTES: 60
    depends_on:
      - postgres-node
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: phonebook-node-frontend
    ports:
      - "8083:80"
    depends_on:
      - node-backend
    restart: unless-stopped

volumes:
  postgres_node_data:
